<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Choose artwork, write a message, and share a digital postcard with Packaroo. No stamp required.">
  <meta name="apple-itunes-app" content="app-id=1480958178, app-argument=https://packaroo.app/postcards/">
  <title>Send a postcard · Packaroo</title>
  <style>
    @font-face { font-family: 'Figtree'; src: url('./Figtree-Bold.ttf') format('truetype'); font-style: normal; font-weight: 700; font-display: swap; }
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #24221e; background: #f7f3ea; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 760px; margin: auto; padding: 48px 24px; text-align: center; }
    .app-icon { display: block; width: 64px; height: 64px; border-radius: 14px; margin: 0 auto 10px; }
    .brand { color: #594a35; font-weight: 800; letter-spacing: .1em; text-decoration: none; }
    h1 { font-family: 'Figtree', system-ui, sans-serif; font-weight: 700; font-size: clamp(2.3rem, 7vw, 4rem); line-height: 1.05; margin: 28px 0 18px; }
    p { font-size: 1.15rem; line-height: 1.6; max-width: 560px; margin: 16px auto; }
    .cover { position: relative; margin: 28px 0; border: 12px solid #fffaf0; box-shadow: 0 8px 24px #3928171c; }
    .art { width: 100%; height: auto; display: block; }
    .artist-mark { position: absolute; right: 8px; bottom: 8px; width: 36px; height: 36px; background: rgb(91.4% 85.1% 68.6%); opacity: .5; pointer-events: none; -webkit-mask: url('./packaroo-artist-mark.png') center / contain no-repeat; mask: url('./packaroo-artist-mark.png') center / contain no-repeat; }
    .actions { margin: 24px 0; }
    .app-store-badge { display: inline-flex; border-radius: 8px; }
    .app-store-badge img { display: block; height: 56px; width: auto; }
    .help a { color: #794020; font-weight: 600; text-underline-offset: 3px; }
    a:focus-visible { outline: 3px solid #1764aa; outline-offset: 5px; }
    .help { font-size: .95rem; color: #615b51; }
    footer { margin-top: 36px; font-size: .9rem; } footer a { color: #615b51; margin: 0 8px; }
  </style>
</head>
<body>
<main>
  <a class="brand" href="/"><img class="app-icon" src="./packaroo-icon.png" alt="" width="64" height="64">PACKAROO</a>
  <h1>Send a postcard.<br>No stamp required.</h1>
  <p>Choose artwork, write your message, and share a short video showing both sides. No trip setup needed.</p>
  <div class="cover">
    <img class="art" src="https://packaroo.s3.us-east-1.amazonaws.com/Grand%20Canyon.png" alt="Illustrated Grand Canyon landscape with the Colorado River" width="1280" height="360">
    <span class="artist-mark" aria-hidden="true"></span>
  </div>
  <div class="actions">
    <a class="app-store-badge" href="https://apps.apple.com/app/packaroo-packing-lists/id1480958178" aria-label="Download Packaroo on the App Store">
      <img src="/App_Store_Badge_Black.svg" alt="Download on the App Store" width="156" height="52">
    </a>
    <p class="help">After installing, open Packaroo and choose <strong>Send a Postcard</strong>.</p>
    <p class="help">Already have Packaroo installed? <a href="https://links.packaroo.app/postcards/">Open Gallery</a></p>
  </div>
  <script>
    if (new URLSearchParams(window.location.search).get('open') === 'gallery') {
      document.querySelector('.help:last-child').textContent = 'Already installed? Open Packaroo on your device. If needed, update it from the App Store.';
    }
  </script>
  <footer><a href="/privacy">Privacy</a><a href="/terms">Terms</a></footer>
</main>
</body>
</html>
